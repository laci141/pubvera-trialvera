name: Build and Deploy Trialvera

# pull_request runs every check below against the proposed change, but never
# publishes an image. The build job has a read-only token on every event. Only
# the publish job holds packages: write, and it runs only on push or
# workflow_dispatch from refs/heads/main, so a manual run on another branch
# cannot push either. Watchtower on the server deploys whatever :latest points
# at, so anything that could push :latest off main would deploy unmerged code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Bump this deliberately and read the diff, rather than being bumped by it.
  # Same version as pubvera-recallis and pubvera-grantvera.
  GOVULNCHECK_VERSION: v1.8.0

# One run per ref at a time, never cancelled: the version step counts the tags
# already on origin, so two overlapping runs on main could otherwise both
# compute the same N.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default for every job: read-only. A job that needs more says so itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    # The version the Compute version step makes, read by the publish job for
    # the version tag and the release. Empty on pull_request and off main.
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Read-only token: this job also runs on pull_request, with the tests, the
    # Go dependencies and the Docker build. Only the publish job below, gated
    # on push or workflow_dispatch from main, can write to GHCR.
    permissions:
      contents: read
    steps:
      # No LFS checkout: the vendored CLI binary was the only LFS file, and
      # the image now builds the CLI from a pinned upstream commit.
      # persist-credentials: false keeps the token out of .git/config. The
      # repository is public, so the version step's git ls-remote needs none.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CalVer YYYY.MM.DD.N: the UTC date plus 1 + the number of tags
      # vYYYY.MM.DD.* already on origin. Every non-pull_request run on main is
      # versioned (push and workflow_dispatch), so a manual run never publishes
      # a "dev" image to :latest. Every other build uses "dev".
      - name: Compute version
        id: version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          D=$(date -u +%Y.%m.%d)
          N=$(git ls-remote --tags origin "refs/tags/v$D.*" | wc -l)
          VERSION="$D.$((N + 1))"
          echo "version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Build, Vet and Gofmt run before Test, as in pubvera-corpova. Test alone
      # let unformatted code and vet findings merge green.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt found unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "gofmt: zero files"

      - name: Test
        run: go test -race ./...

      # govulncheck reports known vulnerabilities in the standard library and in
      # dependencies, but only for code paths this module actually reaches. It
      # scans this module only; a CLI built from a pinned upstream commit in the
      # Dockerfile is a separate binary and is not covered.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

      - name: Check inline JavaScript
        run: |
          # go vet does not see the JavaScript embedded in index.html, so a
          # missing bracket there ships green and breaks the page at runtime.
          # Each <script> block is extracted and parsed with node --check.
          # A file that exists but yields no checkable block fails the build:
          # silently checking nothing is the failure mode this guards against.
          set -euo pipefail
          html=""
          for candidate in index.html web/index.html; do
            if [ -f "$candidate" ]; then html="$candidate"; break; fi
          done
          if [ -z "$html" ]; then
            echo "no index.html found - nothing to check"
            exit 0
          fi
          echo "checking $html"
          tmp=$(mktemp -d)
          node -e '
            const fs = require("fs"), path = require("path");
            const html = fs.readFileSync(process.argv[1], "utf8");
            const dir = process.argv[2];
            const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let m, i = 0;
            while ((m = re.exec(html)) !== null) {
              const attrs = m[1], body = m[2];
              if (body.trim() === "") continue;
              if (/\stype\s*=\s*["\x27](?!text\/javascript|module)/i.test(attrs)) continue;
              const isModule = /\stype\s*=\s*["\x27]module["\x27]/i.test(attrs);
              i += 1;
              fs.writeFileSync(path.join(dir, "block" + i + (isModule ? ".mjs" : ".js")), body);
            }
            console.log(i);
          ' "$html" "$tmp" > "$tmp/count"
          n=$(cat "$tmp/count")
          if [ "$n" -eq 0 ]; then
            echo "$html contains no inline script block - refusing to pass silently"
            exit 1
          fi
          for f in "$tmp"/block*; do
            node --check "$f"
          done
          echo "$n inline block(s) parse"

      # go test does not run the node tests in tools/; a phase filter bug once
      # stayed live because its JS test only ran locally. "|| exit 1" fails the
      # step on the first failing test without relying on the shell's -e.
      - name: Run JS tests
        run: |
          for t in tools/*_test.js; do echo "== $t"; node "$t" || exit 1; done

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image carries the upstream commit its CLI was built from as the
      # label org.pubvera.cli.commit. On pubvera-recallis that label once
      # shipped EMPTY (an ARG default that never reached the runtime stage)
      # while the build, the tests and the deploy were all green. So this
      # builds the image locally first and compares the label with the commit
      # pinned in the Dockerfile, BEFORE anything is pushed. A mismatch stops
      # the job, so an image that cannot say where its CLI came from never
      # reaches :latest.
      #
      # The second build below reuses the gha cache this one fills, so the
      # extra cost is the load into the runner's Docker, not a rebuild.
      - name: Build image for the label check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: trialvera-label-check:ci
          # Same APP_VERSION as the export below, so that build reuses these
          # layers from the gha cache and the checked image is the shipped one.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version || 'dev' }}
          cache-from: type=gha

      - name: Check the CLI commit label
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^ARG PP_LIBRARY_COMMIT=//p' Dockerfile)
          actual=$(docker image inspect trialvera-label-check:ci --format '{{ index .Config.Labels "org.pubvera.cli.commit" }}')
          echo "expected: ${expected}"
          echo "actual:   ${actual}"
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Dockerfile has no global 'ARG PP_LIBRARY_COMMIT=<40-hex commit>' line"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "label org.pubvera.cli.commit does not match the commit pinned in the Dockerfile"
            exit 1
          fi
          echo "label matches the pinned commit"

      # The image is built once and exported as a tar, never pushed from here:
      # this job has no registry login and a read-only token. The tags are the
      # final GHCR names, so docker load in the publish job restores them as
      # they are. The version tag is only set on main; the publish job tags it
      # again from this job's version output.
      - name: Build and export
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/trialvera-image.tar
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.version.outputs.version && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, steps.version.outputs.version) || '' }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version || 'dev' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # build-push-action@v7 does not accept an image ID file input (it warns
      # "Unexpected input(s)" and writes its own temp file instead), so the ID
      # is read from the exported tar itself. An empty iid.txt fails the step.
      - name: Write image ID
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/trialvera-image.tar"
          docker image inspect --format '{{.Id}}' "$REGISTRY/$IMAGE_NAME:latest" > "$RUNNER_TEMP/iid.txt"
          test -s "$RUNNER_TEMP/iid.txt"
          echo "build iid: $(cat "$RUNNER_TEMP/iid.txt")"

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trialvera-image
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/trialvera-image.tar
            ${{ runner.temp }}/iid.txt

  # The only job that can write packages. It runs on push or workflow_dispatch
  # from main only, so :latest (and what Watchtower deploys) only moves on main;
  # a workflow_dispatch on any other branch stops after the build job. The
  # CalVer version tag and the GitHub Release are also created only here.
  publish:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    # contents: write is for the git tag and GitHub Release the last step makes.
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trialvera-image
          path: ${{ runner.temp }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and push
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION" || { echo "no version computed"; exit 1; }
          docker load --input "$RUNNER_TEMP/trialvera-image.tar"
          docker tag "$REGISTRY/$IMAGE_NAME:latest" "$REGISTRY/$IMAGE_NAME:$VERSION"
          echo "build iid: $(cat "$RUNNER_TEMP/iid.txt")"
          echo "loaded Id: $(docker image inspect --format '{{.Id}}' "$REGISTRY/$IMAGE_NAME:latest")"
          docker push "$REGISTRY/$IMAGE_NAME:latest"
          docker push "$REGISTRY/$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$REGISTRY/$IMAGE_NAME:$VERSION"

      # After the pushes, so a release never names an image that does not
      # exist. The first release has no earlier tag to diff against, so it gets
      # fixed notes instead of --generate-notes. This job has no checkout, so
      # every gh call names the repository with --repo.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq length)" = "0" ]; then
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Trialvera $VERSION" --notes "Baseline release: first versioned build. Earlier history is in the merged pull requests."
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Trialvera $VERSION" --generate-notes
          fi